services:
  gazebo-sim:
    build:
      context: .
      dockerfile: gazebo/Dockerfile_gazebo
    container_name: gazebo-sim
    networks:
      - ros_net
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - GZ_SIM_RESOURCE_PATH=/models
    volumes:
      - ${X11_SOCKET_MOUNT:-/tmp/.X11-unix:/tmp/.X11-unix:rw}
      - ${WSLG_MOUNT:-/dev/null:/dev/null}
      - ./gazebo/worlds:/worlds
      - ./gazebo/models:/models
    devices:
      - ${GPU_DEVICE:-/dev/dri}
    command: ros2 launch ros_gz_sim gz_sim.launch.py gz_args:="-v 4 -r /worlds/drone_world.sdf"
    tty: true
    stdin_open: true

  drone:
    build:
      context: ./drone
      dockerfile: Dockerfile_drone
    network_mode: "service:gazebo-sim"
    volumes:
      - drone_locks:/shared
      - ./gazebo/models:/models
    environment:
      - ROS_DOMAIN_ID=0
      - GZ_SIM_RESOURCE_PATH=/models
    tty: true
    stdin_open: true

networks:
  ros_net:
    driver: bridge

volumes:
  # Named volume for drone ID locks.. Cleaned automatically with 'docker compose down -v',
  # ensuring fresh drone ID allocation on every new session.
  drone_locks:

