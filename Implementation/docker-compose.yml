networks:
  swarm_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  # Fast-DDS Discovery Server (unicast) — replaces default
  # multicast discovery for ROS 2.
  discovery-server:
    image: ros:jazzy-ros-base
    container_name: discovery-server
    hostname: discovery-server
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && fastdds discovery -i 0 -l 0.0.0.0 -p 11811"
    networks:
      swarm_net:
        ipv4_address: 172.28.0.10
    ports:
      - "11811:11811/udp"
      - "11811:11811/tcp"
    restart: unless-stopped

  # Gazebo Container: empty world + spawn point for drones
  gazebo:
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    container_name: gazebo
    hostname: gazebo
    depends_on:
      - discovery-server
    environment:
      DISCOVERY_SERVER_IP: "172.28.0.10"
      DISCOVERY_SERVER_PORT: "11811"
      GZ_OWN_IP: "172.28.0.20"
      GZ_SIM_RESOURCE_PATH: "/app/models"
      DISPLAY: "${DISPLAY:-:0}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./models:/app/models:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      swarm_net:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  # Coordinator: Rust swarm coordinator
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    container_name: coordinator
    hostname: coordinator
    depends_on:
      - discovery-server
      - gazebo
    environment:
      DISCOVERY_SERVER_IP: "172.28.0.10"
      DISCOVERY_SERVER_PORT: "11811"
      GZ_OWN_IP: "172.28.0.30"
      WORLD_NAME: "empty"
      DRONE_MODEL_PATH: "/app/models/x3_uav/model.sdf"
    volumes:
      - ./models:/app/models:ro
    networks:
      swarm_net:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

  # Drone Agent (Scalable: docker compose up --scale drone=N)
  drone:
    build:
      context: .
      dockerfile: Dockerfile.drone
    depends_on:
      - coordinator
    environment:
      DISCOVERY_SERVER_IP: "172.28.0.10"
      DISCOVERY_SERVER_PORT: "11811"
      WORLD_NAME: "empty"
    networks:
      - swarm_net
    restart: unless-stopped

