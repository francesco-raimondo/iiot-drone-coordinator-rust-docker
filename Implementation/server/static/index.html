<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm Manager - Drone Coordinator</title>
    <!-- Google Fonts: Inter & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <span class="material-symbols-outlined brand-icon">flight_takeoff</span>
                <div>
                    <h1 class="app-title">Swarm Manager</h1>
                    <p class="app-subtitle">Resilient Multi-Agent Coordination Dashboard</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="btn-line-formation" class="btn btn-primary">
                    <span class="material-symbols-outlined">grid_view</span>
                    Create Line Formation
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- Overview Stats Row -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <span class="material-symbols-outlined">dataset</span>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Total Drones</span>
                    <span id="stat-total" class="stat-value">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrapper stat-active">
                    <span class="material-symbols-outlined">check_circle</span>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Active Agents</span>
                    <span id="stat-active" class="stat-value">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrapper stat-failed">
                    <span class="material-symbols-outlined">warning</span>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Failed / Paused</span>
                    <span id="stat-failed" class="stat-value">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrapper stat-leader">
                    <span class="material-symbols-outlined">stars</span>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Current Leader</span>
                    <span id="stat-leader" class="stat-value">None</span>
                </div>
            </div>
        </section>

        <!-- Drone Swarm Cards Section -->
        <section class="swarm-section">
            <div class="section-header">
                <h2>Swarm Agents</h2>
                <div class="refresh-indicator">
                    <span class="pulse-dot"></span>
                    <span>Live Updates</span>
                </div>
            </div>

            <div id="drones-container" class="drones-grid">
                <!-- Drone cards will be dynamically rendered here -->
                <div class="loading-state">
                    <span class="material-symbols-outlined spinning">sync</span>
                    <p>Loading swarm agents...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>
